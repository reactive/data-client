changesetIgnorePatterns:
  - "**/__tests__/**"
  - "**/*.md"

nodeLinker: node-modules

# Skip the default 1-day npmMinimalAgeGate for our own scope so new releases can be adopted right away
npmPreapprovedPackages:
  - "@anansi/*"

yarnPath: .yarn/releases/yarn-4.18.1.cjs

logFilters:
  - code: YN0060             # Suppress peer dependency mismatch warnings
    level: discard
