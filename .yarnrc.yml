changesetIgnorePatterns:
  - "**/__tests__/**"
  - "**/*.md"

nodeLinker: node-modules

# Skip the default 1-day npmMinimalAgeGate for our own scopes (including @pojo-router, which @anansi/router depends on) so new releases can be adopted right away. Keep in sync with the minimumReleaseAge exemption in .github/renovate.json
npmPreapprovedPackages:
  - "@anansi/*"
  - "@data-client/*"
  - "@pojo-router/*"

yarnPath: .yarn/releases/yarn-4.18.1.cjs

logFilters:
  - code: YN0060             # Suppress peer dependency mismatch warnings
    level: discard
