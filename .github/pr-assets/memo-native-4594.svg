<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Before: master keys each memo result through one nested WeakMap per dependency, so every Hermes garbage collection makes one frozen marking pass per level. After: React Native keeps one WeakMap level, so GC needs one pass, and commits pin the version on screen so transition retries cannot evict it."><title>Before: master keys each memo result through one nested WeakMap per dependency, so every Hermes garbage collection makes one frozen marking pass per level. After: React Native keeps one WeakMap level, so GC needs one pass, and commits pin the version on screen so transition retries cannot evict it.</title><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{font-size:15px;fill:#1f2328}.ts{font-size:13px;fill:#57606a}.th{font-size:15px;font-weight:600;fill:#1f2328}
.tg{font-size:14px;font-weight:600;fill:#1a7f37}.tsr{font-size:12px;fill:#cf222e}.tw{font-size:13px;font-weight:600;fill:#fff}
.lane{fill:#f6f8fa;stroke:#d0d7de}.box{fill:#fff;stroke:#8c959f}.entry{fill:#fff;stroke:#8c959f}
.node{fill:#ddf4ff;stroke:#54aeff}.pill{fill:#fff;stroke:#d0d7de}.pillon{fill:#ddf4ff;stroke:#0969da}
.hot{fill:#ffebe9;stroke:#cf222e;stroke-width:2;fill-opacity:.25}.cool{fill:#dafbe1;stroke:#1a7f37;stroke-width:2;fill-opacity:.25}
.freeze{fill:#cf222e}.ok{fill:#1a7f37}.arr{stroke:#8c959f;stroke-width:2}
@media (prefers-color-scheme:dark){
.t,.th{fill:#e6edf3}.ts{fill:#9198a1}.tg{fill:#3fb950}.tsr{fill:#ff7b72}
.lane{fill:#151b23;stroke:#3d444d}.box,.entry,.pill{fill:#0d1117;stroke:#656c76}
.node{fill:#0c2d6b;stroke:#4493f8}.pillon{fill:#0c2d6b;stroke:#4493f8}
.hot{fill:#490202;stroke:#ff7b72}.cool{fill:#04260f;stroke:#3fb950}
.freeze{fill:#b62324}.ok{fill:#238636}.arr{stroke:#656c76}}
@keyframes w1{0.00%,24.20%{opacity:1}25.00%,100%{opacity:0}}.w1{animation:w1 12.0s linear infinite}@keyframes w2{0%,24.20%{opacity:0}25.00%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w2{animation:w2 12.0s linear infinite}@keyframes w3{0%,49.20%{opacity:0}50.00%,74.20%{opacity:1}75.00%,100%{opacity:0}}.w3{animation:w3 12.0s linear infinite}@keyframes w4{0%,74.20%{opacity:0}75.00%,99.20%{opacity:1}}.w4{animation:w4 12.0s linear infinite}@keyframes w5{0%,24.20%{opacity:0}25.00%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w5{animation:w5 12.0s linear infinite}@keyframes w6{0%,24.20%{opacity:0}25.00%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w6{animation:w6 12.0s linear infinite}@keyframes w7{0%,28.37%{opacity:0}29.17%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w7{animation:w7 12.0s linear infinite}@keyframes w8{0%,28.37%{opacity:0}29.17%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w8{animation:w8 12.0s linear infinite}@keyframes w9{0%,32.53%{opacity:0}33.33%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w9{animation:w9 12.0s linear infinite}@keyframes w10{0%,32.53%{opacity:0}33.33%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w10{animation:w10 12.0s linear infinite}@keyframes w11{0%,36.70%{opacity:0}37.50%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w11{animation:w11 12.0s linear infinite}@keyframes w12{0%,36.70%{opacity:0}37.50%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w12{animation:w12 12.0s linear infinite}@keyframes w13{0%,40.87%{opacity:0}41.67%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w13{animation:w13 12.0s linear infinite}@keyframes w14{0%,40.87%{opacity:0}41.67%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w14{animation:w14 12.0s linear infinite}@keyframes w15{0%,24.20%{opacity:0}25.00%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w15{animation:w15 12.0s linear infinite}@keyframes w16{0%,49.20%{opacity:0}50.00%,99.20%{opacity:1}}.w16{animation:w16 12.0s linear infinite}@keyframes w17{0%,61.70%{opacity:0}62.50%,99.20%{opacity:1}}.w17{animation:w17 12.0s linear infinite}@keyframes w18{0%,49.20%{opacity:0}50.00%,99.20%{opacity:1}}.w18{animation:w18 12.0s linear infinite}@keyframes w19{0%,74.20%{opacity:0}75.00%,99.20%{opacity:1}}.w19{animation:w19 12.0s linear infinite}@keyframes w20{0%,74.20%{opacity:0}75.00%,99.20%{opacity:1}}.w20{animation:w20 12.0s linear infinite}@keyframes w21{0.00%,24.20%{opacity:1}25.00%,100%{opacity:0}}.w21{animation:w21 12.0s linear infinite}@keyframes w22{0%,24.20%{opacity:0}25.00%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w22{animation:w22 12.0s linear infinite}@keyframes w23{0%,24.20%{opacity:0}25.00%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w23{animation:w23 12.0s linear infinite}@keyframes w24{0.00%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w24{animation:w24 12.0s linear infinite}@keyframes w25{0%,49.20%{opacity:0}50.00%,61.70%{opacity:1}62.50%,100%{opacity:0}}.w25{animation:w25 12.0s linear infinite}@keyframes w26{0%,61.70%{opacity:0}62.50%,99.20%{opacity:1}}.w26{animation:w26 12.0s linear infinite}@keyframes w27{0.00%,24.20%{opacity:1}25.00%,100%{opacity:0}}.w27{animation:w27 12.0s linear infinite}@keyframes w28{0%,24.20%{opacity:0}25.00%,49.20%{opacity:1}50.00%,100%{opacity:0}}.w28{animation:w28 12.0s linear infinite}@keyframes w29{0%,49.20%{opacity:0}50.00%,99.20%{opacity:1}}.w29{animation:w29 12.0s linear infinite}@keyframes w30{0%,74.20%{opacity:0}75.00%,99.20%{opacity:1}}.w30{animation:w30 12.0s linear infinite}</style><rect x="12" y="12" width="222" height="30" rx="15" class="pill" /><g class="w1"><rect x="12" y="12" width="222" height="30" rx="15" class="pillon" /></g><text x="123.0" y="32" class="ts" text-anchor="middle">1  Store version A renders</text><rect x="246" y="12" width="222" height="30" rx="15" class="pill" /><g class="w2"><rect x="246" y="12" width="222" height="30" rx="15" class="pillon" /></g><text x="357.0" y="32" class="ts" text-anchor="middle">2  Hermes GC marks the memo</text><rect x="480" y="12" width="222" height="30" rx="15" class="pill" /><g class="w3"><rect x="480" y="12" width="222" height="30" rx="15" class="pillon" /></g><text x="591.0" y="32" class="ts" text-anchor="middle">3  Transition retries render B1, B2</text><rect x="714" y="12" width="222" height="30" rx="15" class="pill" /><g class="w4"><rect x="714" y="12" width="222" height="30" rx="15" class="pillon" /></g><text x="825.0" y="32" class="ts" text-anchor="middle">4  Urgent render reads A again</text><rect x="8" y="64" width="944" height="210" rx="10" class="lane" /><text x="24" y="90" class="th" text-anchor="start">Before (master): one WeakMap level per dependency</text><rect x="24" y="114" width="70" height="34" rx="6" class="box" /><text x="59" y="136" class="ts" text-anchor="middle">input</text><line x1="104" y1="131" x2="120" y2="131" class="arr"/><rect x="120" y="114" width="76" height="34" rx="6" class="box" /><text x="158" y="136" class="ts" text-anchor="middle">WeakMap</text><line x1="196" y1="131" x2="212" y2="131" class="arr"/><rect x="212" y="114" width="76" height="34" rx="6" class="box" /><text x="250" y="136" class="ts" text-anchor="middle">WeakMap</text><line x1="288" y1="131" x2="304" y2="131" class="arr"/><rect x="304" y="114" width="76" height="34" rx="6" class="box" /><text x="342" y="136" class="ts" text-anchor="middle">WeakMap</text><line x1="380" y1="131" x2="396" y2="131" class="arr"/><rect x="396" y="114" width="76" height="34" rx="6" class="box" /><text x="434" y="136" class="ts" text-anchor="middle">WeakMap</text><line x1="472" y1="131" x2="488" y2="131" class="arr"/><rect x="488" y="114" width="76" height="34" rx="6" class="box" /><text x="526" y="136" class="ts" text-anchor="middle">… ×N</text><g class="w5"><rect x="120" y="114" width="76" height="34" rx="6" class="hot" /></g><g class="w6"><text x="158" y="166" class="tsr" text-anchor="middle">pass 1</text></g><g class="w7"><rect x="212" y="114" width="76" height="34" rx="6" class="hot" /></g><g class="w8"><text x="250" y="166" class="tsr" text-anchor="middle">pass 2</text></g><g class="w9"><rect x="304" y="114" width="76" height="34" rx="6" class="hot" /></g><g class="w10"><text x="342" y="166" class="tsr" text-anchor="middle">pass 3</text></g><g class="w11"><rect x="396" y="114" width="76" height="34" rx="6" class="hot" /></g><g class="w12"><text x="434" y="166" class="tsr" text-anchor="middle">pass 4</text></g><g class="w13"><rect x="488" y="114" width="76" height="34" rx="6" class="hot" /></g><g class="w14"><text x="526" y="166" class="tsr" text-anchor="middle">pass 5</text></g><g class="w15"><rect x="24" y="184" width="560" height="30" rx="4" class="freeze" /><text x="304" y="204" class="tw" text-anchor="middle">UI frozen: one stop-the-world pass per level (7,474 passes measured)</text></g><text x="640" y="110" class="ts" text-anchor="start">Cached results under this input</text><rect x="640" y="120" width="90" height="30" rx="6" class="entry" /><text x="685" y="140" class="t" text-anchor="middle">A</text><g class="w16"><rect x="738" y="120" width="90" height="30" rx="6" class="entry" /><text x="783" y="140" class="t" text-anchor="middle">B1</text></g><g class="w17"><rect x="836" y="120" width="90" height="30" rx="6" class="entry" /><text x="881" y="140" class="t" text-anchor="middle">B2</text></g><g class="w18"><text x="640" y="174" class="ts" text-anchor="start">every version stays while its entities live</text></g><g class="w19"><text x="640" y="204" class="tg" text-anchor="start">read A → same object ✓</text></g><g class="w20"><text x="640" y="226" class="ts" text-anchor="start">(but every GC paid the freeze)</text></g><g class="w21"><text x="640" y="204" class="ts" text-anchor="start">A is on screen</text></g><rect x="8" y="290" width="944" height="220" rx="10" class="lane" /><text x="24" y="316" class="th" text-anchor="start">After (this PR, React Native): one WeakMap level, pinned by commits</text><rect x="24" y="340" width="70" height="34" rx="6" class="box" /><text x="59" y="362" class="ts" text-anchor="middle">input</text><line x1="98" y1="357" x2="116" y2="357" class="arr"/><rect x="120" y="340" width="76" height="34" rx="6" class="box" /><text x="158" y="362" class="ts" text-anchor="middle">WeakMap</text><text x="24" y="396" class="ts" text-anchor="start">other deps checked with ===</text><g class="w22"><rect x="120" y="340" width="76" height="34" rx="6" class="cool" /></g><g class="w23"><rect x="24" y="410" width="560" height="30" rx="4" class="ok" /><text x="304" y="430" class="tw" text-anchor="middle">one marking pass: no freeze</text></g><line x1="200" y1="357" x2="236" y2="357" class="arr"/><rect x="240" y="334" width="344" height="46" rx="8" class="node" /><rect x="248" y="340" width="104" height="34" rx="6" class="entry" /><text x="300" y="396" class="ts" text-anchor="middle">newest</text><rect x="360" y="340" width="104" height="34" rx="6" class="entry" /><text x="412" y="396" class="ts" text-anchor="middle">committed</text><rect x="472" y="340" width="104" height="34" rx="6" class="entry" /><text x="524" y="396" class="ts" text-anchor="middle">settled</text><g class="w24"><text x="300" y="362" class="t" text-anchor="middle">A</text></g><g class="w25"><text x="300" y="362" class="t" text-anchor="middle">B1</text></g><g class="w26"><text x="300" y="362" class="t" text-anchor="middle">B2</text></g><text x="412" y="362" class="t" text-anchor="middle">A, pinned</text><text x="524" y="362" class="t" text-anchor="middle">A, pinned</text><g class="w27"><text x="640" y="350" class="ts" text-anchor="start">A commits: an effect calls</text><text x="640" y="370" class="ts" text-anchor="start">commit(A), which pins what</text><text x="640" y="390" class="ts" text-anchor="start">A's render read</text></g><g class="w28"><text x="640" y="350" class="ts" text-anchor="start">GC sees one WeakMap</text></g><g class="w29"><text x="640" y="350" class="ts" text-anchor="start">retries replace only newest;</text><text x="640" y="370" class="ts" text-anchor="start">discarded renders never commit</text></g><g class="w30"><text x="640" y="410" class="tg" text-anchor="start">read A → pinned entry ✓</text><text x="640" y="432" class="ts" text-anchor="start">same object, nested values too</text></g><text x="24" y="490" class="ts" text-anchor="start">settled = last committed store with no optimistic updates in flight, so a rollback also hits</text></svg>