<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Before: a response that arrives while Activity hides DataProvider is dropped and the UI stays loading. After: the store keeps the response and the post renders when shown.">
<style>@keyframes w5_25_35{0%,4%{opacity:0.35}5%,24%{opacity:1}25%,100%{opacity:0.35}}@keyframes w25_38_35{0%,24%{opacity:0.35}25%,37%{opacity:1}38%,100%{opacity:0.35}}@keyframes w38_72_35{0%,37%{opacity:0.35}38%,71%{opacity:1}72%,100%{opacity:0.35}}@keyframes w72_92_35{0%,71%{opacity:0.35}72%,91%{opacity:1}92%,100%{opacity:0.35}}@keyframes w27_74_0{0%,26%{opacity:0}27%,73%{opacity:1}74%,100%{opacity:0}}@keyframes w76_94_0{0%,75%{opacity:0}76%,93%{opacity:1}94%,100%{opacity:0}}@keyframes w56_94_0{0%,55%{opacity:0}56%,93%{opacity:1}94%,100%{opacity:0}}@keyframes w5_25_0{0%,4%{opacity:0}5%,24%{opacity:1}25%,100%{opacity:0}}@keyframes w25_55_0{0%,24%{opacity:0}25%,54%{opacity:1}55%,100%{opacity:0}}@keyframes w56_72_0{0%,55%{opacity:0}56%,71%{opacity:1}72%,100%{opacity:0}}@keyframes w72_94_0{0%,71%{opacity:0}72%,93%{opacity:1}94%,100%{opacity:0}}@keyframes w0_74_100{0%,0%{opacity:1}0%,73%{opacity:0}74%,100%{opacity:1}}@keyframes w1_74_0{0%,0%{opacity:0}1%,73%{opacity:1}74%,100%{opacity:0}}@keyframes w74_94_0{0%,73%{opacity:0}74%,93%{opacity:1}94%,100%{opacity:0}}@keyframes w1_58_0{0%,0%{opacity:0}1%,57%{opacity:1}58%,100%{opacity:0}}@keyframes w58_94_0{0%,57%{opacity:0}58%,93%{opacity:1}94%,100%{opacity:0}}
.bg{fill:#ffffff;stroke:#d0d7de}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#1f2328}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.pill{fill:#ddf4ff;stroke:#3d97db}
.pilltext{font-size:14px;font-weight:600;fill:#0b5a95}
.lane{font-size:15px;font-weight:700}
.box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5}
.label{font-size:16px;font-weight:600}
.small{font-size:12px;fill:#59636e}
.tiny{font-size:12px;font-weight:600;fill:#59636e}
.inv{fill:#ffffff;font-size:10px}
.muted{fill:#59636e}
.bad{fill:#cf222e}
.good{fill:#1a7f37}
.x{font-size:26px;font-weight:700;fill:#cf222e}
.track{stroke:#8c959f;stroke-width:2;stroke-dasharray:6 6}
.hiddenpill{fill:#eaeef2;stroke:#8c959f}
.gate{fill:#cf222e;transform-box:fill-box;transform-origin:center}
.packet{fill:#3d97db}
.caption{font-size:15px}
@keyframes uidim{0%,25%{opacity:1}28%,72%{opacity:.35}75%,100%{opacity:1}}
@keyframes gate{0%,25%{transform:scaleY(0)}29%,92%{transform:scaleY(1)}95%,100%{transform:scaleY(0)}}
@keyframes pkbad{0%,4%{opacity:0;transform:translateX(0)}6%,38%{opacity:1;transform:translateX(0)}54%{opacity:1;transform:translateX(358px)}58%{opacity:0;transform:translateX(358px)}100%{opacity:0;transform:translateX(358px)}}
@keyframes pkgood{0%,4%{opacity:0;transform:translateX(0)}6%,38%{opacity:1;transform:translateX(0)}55%{opacity:1;transform:translateX(467px)}58%{opacity:0;transform:translateX(467px)}100%{opacity:0;transform:translateX(467px)}}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117;stroke:#30363d}
text{fill:#e6edf3}
.pill{fill:#0c2d48;stroke:#3d97db}.pilltext{fill:#9fd2ff}
.box{fill:#161b22;stroke:#6e7681}
.small,.tiny,.muted{fill:#9198a1}
.bad,.x{fill:#ff7b72}.gate{fill:#f85149}
.good{fill:#3fb950}
.track{stroke:#6e7681}
.hiddenpill{fill:#21262d;stroke:#6e7681}
.inv{fill:#ffffff}
}
</style>
<rect x="1" y="1" width="958" height="438" rx="14" class="bg"/>
<g style="animation:w5_25_35 10s linear infinite"><rect x="60" y="22" width="190" height="30" rx="15" class="pill"/><text x="155" y="42" class="pilltext" text-anchor="middle" style="">1  fetch starts</text></g>
<g style="animation:w25_38_35 10s linear infinite"><rect x="285" y="22" width="190" height="30" rx="15" class="pill"/><text x="380" y="42" class="pilltext" text-anchor="middle" style="">2  &lt;Activity&gt; hides</text></g>
<g style="animation:w38_72_35 10s linear infinite"><rect x="510" y="22" width="190" height="30" rx="15" class="pill"/><text x="605" y="42" class="pilltext" text-anchor="middle" style="">3  response arrives</text></g>
<g style="animation:w72_92_35 10s linear infinite"><rect x="735" y="22" width="190" height="30" rx="15" class="pill"/><text x="830" y="42" class="pilltext" text-anchor="middle" style="">4  &lt;Activity&gt; shows</text></g>
<text x="40" y="106" class="lane bad" text-anchor="start" style="">Before</text>
<rect x="40" y="120" width="110" height="56" rx="10" class="box"/><text x="95" y="154" class="label" text-anchor="middle" style="">API</text>
<line x1="150" y1="148" x2="560" y2="148" class="track"/>
<rect x="560" y="120" width="150" height="56" rx="10" class="box"/><text x="635" y="114" class="small" text-anchor="middle" style="">store</text>
<g style="animation:uidim 10s linear infinite"><rect x="770" y="120" width="150" height="56" rx="10" class="box"/><text x="845" y="114" class="small mono" text-anchor="middle" style="">&lt;Posts /&gt;</text>
<text x="845" y="154" class="label muted" text-anchor="middle" style="">loading…</text>
</g>
<g style="animation:w27_74_0 10s linear infinite"><rect x="805" y="182" width="80" height="22" rx="11" class="hiddenpill"/><text x="845" y="197" class="tiny" text-anchor="middle" style="">hidden</text></g>
<text x="845" y="197" class="tiny bad" text-anchor="middle" style="animation:w76_94_0 10s linear infinite">stuck</text>
<text x="635" y="154" class="label muted" text-anchor="middle" style="">—</text>
<rect x="541" y="116" width="8" height="64" rx="3" class="gate" style="animation:gate 10s linear infinite"/>
<text x="524" y="157" class="x" text-anchor="middle" style="animation:w56_94_0 10s linear infinite">✕</text>
<g style="animation:pkbad 10s linear infinite"><circle cx="168" cy="148" r="13" class="packet"/><text x="168" y="153" class="tiny inv" text-anchor="middle" style="">Post</text></g>
<text x="40" y="216" class="caption" text-anchor="start" style="animation:w5_25_0 10s linear infinite">useSuspense() fetches; the UI shows loading</text>
<text x="40" y="216" class="caption" text-anchor="start" style="animation:w25_55_0 10s linear infinite">hide → cleanup(): dispatch becomes a no-op</text>
<text x="40" y="216" class="caption" text-anchor="start" style="animation:w56_72_0 10s linear infinite">the response is dropped</text>
<text x="40" y="216" class="caption" text-anchor="start" style="animation:w72_94_0 10s linear infinite">show → still loading, forever</text>
<text x="40" y="276" class="lane good" text-anchor="start" style="">After (this PR)</text>
<rect x="40" y="290" width="110" height="56" rx="10" class="box"/><text x="95" y="324" class="label" text-anchor="middle" style="">API</text>
<line x1="150" y1="318" x2="560" y2="318" class="track"/>
<rect x="560" y="290" width="150" height="56" rx="10" class="box"/><text x="635" y="284" class="small" text-anchor="middle" style="">store</text>
<g style="animation:uidim 10s linear infinite"><rect x="770" y="290" width="150" height="56" rx="10" class="box"/><text x="845" y="284" class="small mono" text-anchor="middle" style="">&lt;Posts /&gt;</text>
<g style="animation:w0_74_100 10s linear infinite"></g>
<text x="845" y="324" class="label muted" text-anchor="middle" style="animation:w1_74_0 10s linear infinite">loading…</text>
<text x="845" y="324" class="label good" text-anchor="middle" style="animation:w74_94_0 10s linear infinite">Post 5</text>
</g>
<g style="animation:w27_74_0 10s linear infinite"><rect x="805" y="352" width="80" height="22" rx="11" class="hiddenpill"/><text x="845" y="367" class="tiny" text-anchor="middle" style="">hidden</text></g>
<text x="635" y="324" class="label muted" text-anchor="middle" style="animation:w1_58_0 10s linear infinite">—</text>
<text x="635" y="324" class="label good" text-anchor="middle" style="animation:w58_94_0 10s linear infinite">Post 5</text>
<g style="animation:pkgood 10s linear infinite"><circle cx="168" cy="318" r="13" class="packet"/><text x="168" y="323" class="tiny inv" text-anchor="middle" style="">Post</text></g>
<text x="40" y="386" class="caption" text-anchor="start" style="animation:w5_25_0 10s linear infinite">useSuspense() fetches; the UI shows loading</text>
<text x="40" y="386" class="caption" text-anchor="start" style="animation:w25_55_0 10s linear infinite">hide → cleanup(): the store keeps dispatching</text>
<text x="40" y="386" class="caption" text-anchor="start" style="animation:w56_72_0 10s linear infinite">the response is stored while hidden</text>
<text x="40" y="386" class="caption" text-anchor="start" style="animation:w72_94_0 10s linear infinite">show → the post renders, with no refetch</text>
</svg>