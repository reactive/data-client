name: skills
on:
  pull_request:
    branches:
      - master
    # Inputs of website/framework-docs/skillReferences.mjs
    paths:
      - 'docs/**'
      - '.agents/skills/**'
      - 'website/framework-docs/**'
      - 'website/package.json'
      - '.github/workflows/skills.yml'

concurrency:
  group: skills-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'yarn'
      - name: Install packages
        run: ./scripts/ci-install.sh website
      - name: Check skill references match the docs
        run: yarn build:skills --check
