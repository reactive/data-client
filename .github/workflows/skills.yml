name: skills
on:
  # master catches drift from lockfile bumps or PRs merged in sequence
  push:
    branches:
      - master
    # Inputs of website/framework-docs/skillReferences.mjs
    paths:
      - 'docs/**'
      - '.agents/skills/**'
      - 'website/framework-docs/**'
      - 'website/package.json'
      - 'yarn.lock'
      - '.github/workflows/skills.yml'
      - '.gitattributes'
  pull_request:
    branches:
      - master
  # Required check: no `paths` here (merge_group ignores them); the gate
  # skips the job unless a file in push `paths` changed
  merge_group:

# PRs cancel superseded runs. Push runs get their own group, so master never
# shows a cancelled (red) run.
concurrency:
  group: skills-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/paths-gate.yml

  references:
    # The required check's name
    name: skills
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'yarn'
      - name: Install packages
        run: ./scripts/ci-install.sh website
      - name: Check skill references match the docs
        run: yarn build:skills --check
