name: skills
on:
  # master catches drift from lockfile bumps or PRs merged in sequence
  push:
    branches:
      - master
    # Inputs of website/framework-docs/skillReferences.mjs and checkExamples.mjs
    paths:
      - 'docs/**'
      - '.agents/skills/**'
      - 'website/framework-docs/**'
      # symlinked into skills that others bundle
      - 'website/static/codemods/**'
      - 'package.json'
      - 'website/package.json'
      - 'yarn.lock'
      - '.github/workflows/skills.yml'
      - '.github/workflows/paths-gate.yml'
      - '.gitattributes'
      - 'website/src/components/Playground/editor-types/**'
      - 'website/src/components/Playground/DesignSystem/index.ts'
  pull_request:
    branches:
      - master
  # Required check: no `paths` (see paths-gate.yml)
  merge_group:

# PRs cancel superseded runs. Push runs get their own group, so master never
# shows a cancelled (red) run.
concurrency:
  group: skills-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name != 'push'
    uses: ./.github/workflows/paths-gate.yml

  references:
    name: skills
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'yarn'
      - name: Install packages
        run: ./scripts/ci-install.sh website
      - name: Check skill references match the docs
        run: yarn build:skills --check
      - name: Type-check React and Vue examples in the docs
        if: ${{ !cancelled() }}
        run: yarn check:doc-examples
