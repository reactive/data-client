name: paths gate
# Reusable: lets a required check report on every PR and merge queue entry.
# merge_group ignores `paths`, and a required check that never runs blocks the
# PR, so callers trigger without `paths` (push excepted) and skip their job
# unless a file in their `on.push.paths` changed. A skipped job passes.
# dependency-gate.yml reads `paths` the same way.
on:
  workflow_call:
    outputs:
      relevant:
        value: ${{ jobs.check.outputs.relevant }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # The caller's push `paths` (github.workflow_ref names the caller)
          workflow="${GITHUB_WORKFLOW_REF#*/*/}"
          mapfile -t paths < <(yq -r '.on.push.paths[]' "${workflow%@*}")
          # Unlike GitHub `paths`, git excludes apply regardless of order, so a
          # later pattern can't re-include an excluded path
          pathspecs=()
          for p in "${paths[@]}"; do
            if [[ "$p" == '!'* ]]; then pathspecs+=(":(exclude,glob)${p:1}"); else pathspecs+=(":(glob)$p"); fi
          done
          # Fail open: no paths, a missing base or a failed diff all run the job
          relevant=true
          if [ "${#pathspecs[@]}" -gt 0 ] \
            && git fetch -q --depth=1 origin "$BASE" \
            && changed="$(git diff --name-only --no-renames "$BASE" HEAD -- "${pathspecs[@]}")" \
            && [ -z "$changed" ]; then
            relevant=false
          fi
          [ -z "${changed:-}" ] || echo "$changed"
          echo "relevant=$relevant" | tee -a "$GITHUB_OUTPUT"
