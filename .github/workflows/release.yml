name: Release

on:
  push:
    branches:
      - master

# Queue every run instead of cancelling pending ones (red on the branch)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      archive-version: ${{ steps.archive.outputs.version }}
      archive-ref: ${{ steps.archive.outputs.ref }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'
      - name: Install packages
        run: ./scripts/ci-install.sh

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn changeset:version
          publish: yarn changeset:publish
          commit: "internal: Publish new version"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # hasChangesets is 'false' after the Version Packages PR is merged (no
      # changeset files remain), which is the same run where publish executes.
      # We can't use `published == 'true'` because the custom yarn publish
      # command isn't detectable by changesets/action.
      - name: Create GitHub Releases
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/create-github-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A breaking version (0.x minor, else major) replaces the previous one's
      # docs, so docs-snapshot.yml freezes those at /<version>/
      - name: Find docs to archive
        id: archive
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          warn() { echo "::warning title=No docs archive::$1; dispatch docs-snapshot.yml if this release was breaking"; exit 0; }
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --depth=1 origin "$BEFORE" ||
            warn "couldn't fetch $BEFORE to compare versions"
          version() { node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version'; }
          old="$(git show "$BEFORE:packages/react/package.json" | version)" ||
            warn "no packages/react/package.json at $BEFORE"
          new="$(version < packages/react/package.json)"
          line() { [[ "$1" == 0.* ]] && echo "${1%.*}" || echo "${1%%.*}"; }
          if [ "$(line "$old")" != "$(line "$new")" ] && [[ "$old" != *-* ]]; then
            echo "version=$(line "$old")" >> "$GITHUB_OUTPUT"
            echo "ref=@data-client/react@$old" >> "$GITHUB_OUTPUT"
          fi

  docs-archive:
    needs: release
    if: needs.release.outputs.archive-version
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/docs-snapshot.yml
    with:
      version: ${{ needs.release.outputs.archive-version }}
      ref: ${{ needs.release.outputs.archive-ref }}
