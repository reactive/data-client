name: Release
# A manual run is always a beta: name it so in the run list
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Beta from {0}', github.ref_name) || '' }}

on:
  push:
    branches:
      - master
  # Publishes a snapshot of the chosen branch under npm's `beta` tag, like
  # 0.19.0-beta-<datetime>-<sha>. It commits nothing. npm trusts only this
  # workflow file to publish, so betas run here instead of their own file.
  workflow_dispatch:
    inputs:
      # Never read: the run form shows only inputs, so this one tells whoever
      # opens it what the button does
      publish:
        description: 'A manual run publishes a beta. Stable releases publish when the Version Packages PR merges.'
        type: choice
        options:
          - beta snapshot (npm tag "beta")

# Queue every run instead of cancelling pending ones (red on the branch), in
# one queue with maintenance branches, so each reads npm's `latest` after the
# other publishes and only one release takes it (and GitHub's Latest)
concurrency:
  group: ${{ github.workflow }}
  queue: max

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      archive-version: ${{ steps.archive.outputs.version }}
      archive-ref: ${{ steps.archive.outputs.ref }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'
      - name: Install packages
        run: ./scripts/ci-install.sh

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: yarn changeset:version
          publish-script: yarn changeset:publish
          commit-message: "internal: Publish new version"
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # has-changesets is 'false' after the Version Packages PR is merged (no
      # changeset files remain), which is the same run where publish executes.
      # We can't use `published == 'true'` because the custom yarn publish
      # command isn't detectable by changesets/action.
      - name: Create GitHub Releases
        if: steps.changesets.outputs.has-changesets == 'false'
        run: node scripts/create-github-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A stable release of a new line (scripts/maintenance/version-line.sh)
      # replaces the previous line's docs, so docs-snapshot.yml freezes those
      # at <version>.dataclient.io
      - name: Find docs to archive
        id: archive
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          warn() { echo "::warning title=No docs archive::$1; dispatch docs-snapshot.yml if this release was breaking"; exit 0; }
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --depth=1 origin "$BEFORE" ||
            warn "couldn't fetch $BEFORE to compare versions"
          old="$(git show "$BEFORE:packages/react/package.json" | jq -r .version)" ||
            warn "no packages/react/package.json at $BEFORE"
          new="$(jq -r .version packages/react/package.json)"
          source scripts/maintenance/version-line.sh
          # the line master was ahead of, built from its branch
          cur=website/versionCurrent.json
          current="$([ ! -f "$cur" ] || jq -r .version "$cur")"
          prev="$(replaced_line "$old" "$new" "$current")" ||
            warn "the previous version, $old, is a prerelease"
          [ -z "$prev" ] || {
            echo "version=$prev"
            echo "ref=$([ -n "$current" ] && jq -r .ref "$cur" || echo "@data-client/react@$old")"
          } >> "$GITHUB_OUTPUT"

  beta:
    name: Beta
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      # the changelog generator reads each changeset's PR
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'
      - name: Install packages
        run: ./scripts/ci-install.sh

      - name: Version
        env:
          # the changelog generator looks up each changeset's PR and author
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yarn changeset:version:beta
          # every packages/* workspace is public: if none was bumped, publishing skips every
          # package and still reports success
          ! git diff --quiet -- 'packages/*/package.json' ||
            { echo "::error::No pending changesets bump a package under packages/"; exit 1; }

      - name: Publish to npm
        run: yarn changeset:publish:beta

  docs-archive:
    needs: release
    if: needs.release.outputs.archive-version
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/docs-snapshot.yml
    with:
      version: ${{ needs.release.outputs.archive-version }}
      ref: ${{ needs.release.outputs.archive-ref }}
