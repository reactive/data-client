name: agent-rules
on:
  # master catches drift from PRs merged in sequence
  push:
    branches:
      - master
    # Inputs and outputs of scripts/agent-rules.mjs, and the hook tests
    paths:
      - '**/.cursor/rules/**'
      - '**/.claude/rules/**'
      - '.claude/skills'
      - '.cursor/hooks/**'
      - 'scripts/agent-rules.mjs'
      - '.github/workflows/agent-rules.yml'
  pull_request:
    branches:
      - master
  # Required check: no `paths` here (merge_group ignores them); the gate
  # skips the job unless a file in push `paths` changed
  merge_group:

concurrency:
  group: agent-rules-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/paths-gate.yml

  check:
    # The required check's name
    name: agent-rules
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      # no install: these only need node and git
      - name: Check Claude Code rules match the Cursor rules
        run: node scripts/agent-rules.mjs --check
      - name: Test agent hooks
        run: node --test '.cursor/hooks/*.test.js'
