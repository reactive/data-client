name: Bundle Size

on:
  # PR-only: on push the action measures but has nowhere to report
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ master ]
    paths:
      - 'packages/**'
      - '!packages/**/__tests__/**'
      - '!packages/*/typescript-tests/**'
      - '!packages/*/src-*-types/**'
      - '!packages/**/*.md'
      # not bundled by examples/test-bundlesize
      - '!packages/graphql/**'
      - '!packages/test/**'
      - '!packages/vue/**'
      - 'yarn.lock'
      - 'examples/test-bundlesize/**'
      - 'scripts/ci-deps-relevant.mjs'
      - '.github/workflows/dependency-gate.yml'
      - '.github/workflows/bundle_size.yml'

concurrency:
  group: bundle-size-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Skips dependency bumps that can't change what this measures
  changes:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/dependency-gate.yml
    with:
      workspaces: examples/test-bundlesize

  build:
    needs: changes
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # size comment

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
        # PR code runs here; the action's git fetches need no token (public repo)
        persist-credentials: false
    - uses: actions/setup-node@v6
      with:
        node-version: '26'
        cache: 'yarn'
    - name: Install packages
      run: ./scripts/ci-install.sh examples/test-bundlesize
    - name: compressed-size-action
      uses: preactjs/compressed-size-action@v2
      continue-on-error: true
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: false
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        build-script: "ci:build:bundlesize"
        pattern: "examples/test-bundlesize/dist/**/*.{js,json}"
        exclude: "{examples/test-bundlesize/dist/manifest.json,**/*.LICENSE.txt,**/*.map,**/node_modules/**}"
        minimum-change-threshold: 8

  immutable-leak:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'yarn'
    - name: Install packages
      run: ./scripts/ci-install.sh examples/test-bundlesize
    - name: Build production bundles
      run: yarn ci:build:bundlesize
    - name: Assert no ImmutableJS code in main-entry bundles
      # Immutable support must stay behind /imm subpath exports (zero bundle
      # cost for non-users — see plans/immutablejs-support.md F1). The
      # `__ownerID` string only appears in the ImmutableJS duck-type check,
      # so its presence means immutable code leaked into a main entry.
      run: |
        if grep -rl --include='*.js' "__ownerID" examples/test-bundlesize/dist/; then
          echo "::error::ImmutableJS support code leaked into main-entry bundles (__ownerID marker found). Keep immutable code behind /imm subpath exports."
          exit 1
        fi
        echo "No immutable markers found in production bundles."
