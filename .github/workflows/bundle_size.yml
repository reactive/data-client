name: Bundle Size

on:
  # PR-only: on push the action measures but has nowhere to report
  pull_request:
    # ready_for_review: drafts skip the job below, so run once marked ready
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ master ]
    paths:
      - 'packages/**'
      - '!packages/**/__tests__/**'
      - '!packages/*/typescript-tests/**'
      - '!packages/*/src-*-types/**'
      - '!packages/**/*.md'
      - 'yarn.lock'
      - 'examples/test-bundlesize/**'
      - '.github/workflows/bundle_size.yml'

concurrency:
  group: bundle-size-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
    - uses: actions/setup-node@v6
      with:
        node-version: '26'
        cache: 'yarn'
    - name: Install packages
      run: ./scripts/ci-install.sh examples/test-bundlesize
    - name: compressed-size-action
      uses: preactjs/compressed-size-action@v2
      continue-on-error: true
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: false
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        build-script: "ci:build:bundlesize"
        pattern: "examples/test-bundlesize/dist/**/*.{js,json}"
        exclude: "{examples/test-bundlesize/dist/manifest.json,**/*.LICENSE.txt,**/*.map,**/node_modules/**}"
        minimum-change-threshold: 8
