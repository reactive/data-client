name: website
on:
  pull_request:
    branches:
      - master
    # Published site only. Keep in sync with website/scripts/vercel-ignore.sh.
    paths:
      - 'website/**'
      - 'docs/core/**'
      - 'docs/rest/**'
      - 'docs/graphql/**'
      - '.github/workflows/site-preview.yml'
  # Refreshes the webpack cache that PRs restore from
  push:
    branches:
      - master
    paths:
      - 'website/**'
      - 'docs/core/**'
      - 'docs/rest/**'
      - 'docs/graphql/**'
      - '.github/workflows/site-preview.yml'

concurrency:
  group: site-preview-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # One job so the install happens once: the typecheck is short next to it
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Test Vercel ignore decision
        run: bash website/scripts/vercel-ignore.test.sh
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'yarn'
      - name: Install packages
        run: ./scripts/ci-install.sh website
      - name: Build package types and the packages the website imports
        run: yarn ci:build:website
      - name: Typecheck website
        run: yarn workspace rdc-website typecheck
      # Docusaurus' webpack cache (~73 MiB compressed). Only master saves it, so
      # PRs share one fresh entry instead of each storing their own; stale
      # modules just miss.
      - uses: actions/cache/restore@v6
        with:
          path: website/node_modules/.cache
          key: website-build-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            website-build-${{ hashFiles('yarn.lock') }}-
            website-build-
      - name: Build website
        env:
          # Build drafts like the Vercel preview does
          VERCEL_ENV: preview
        # explicit `shell: bash` adds pipefail, so a failed build isn't masked by tee
        shell: bash
        run: |
          yarn workspace rdc-website build 2>&1 | tee build.log
          # Warnings (broken links, webpack warnings) fail the check, but not
          # the Vercel deploy, which only stops on errors
          if grep -E '\[(WARNING|ERROR)\]' build.log; then
            echo "::error::Website build logged warnings (listed above)"
            exit 1
          fi
      - if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: website/node_modules/.cache
          # Unique per run: an existing key can't be overwritten
          key: website-build-${{ hashFiles('yarn.lock') }}-${{ github.run_id }}
