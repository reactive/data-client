name: website
on:
  pull_request:
    branches:
      - master
  # Required check: no `paths` (see paths-gate.yml). The queue builds the
  # merged site but never deploys it.
  merge_group:
  # Deploys production and refreshes the build cache that PRs restore from
  push:
    branches:
      - master
    # Published site only. Keep in sync with website/scripts/vercel-ignore.sh.
    paths:
      - 'website/**'
      - 'docs/core/**'
      - 'docs/rest/**'
      - 'docs/graphql/**'
      # Imported by website/src/components/SkillTabs.tsx
      - '.agents/skill-packages.json'
      - '.agents/skills/data-client-setup/references.json'
      - '.github/workflows/site-preview.yml'
      - '.github/workflows/docs-deploy.yml'
      - '.github/actions/website-install/**'
      - '.github/workflows/paths-gate.yml'
  # Redeploys production from master, e.g. after a failed deploy
  workflow_dispatch:

# PRs get one group per branch, and a push cancels the older run, so only the
# newest commit deploys. master pushes and dispatches queue in one group, so
# production deploys in push order and master never shows a cancelled (red)
# run. Queue entries get their own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-preview-pr-{0}', github.head_ref) || github.event_name == 'merge_group' && format('site-preview-queue-{0}', github.run_id) || 'site-deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: ./.github/workflows/paths-gate.yml

  # The preview's critical path: the preview deploys after this job alone.
  # The checks run beside it in `checks`; `website` requires both, and
  # production deploys only when both passed
  build:
    name: website build
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      locales: ${{ steps.locales.outputs.locales }}
      next: ${{ steps.next.outputs.next }}
      target: ${{ steps.decide.outputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Deployed pages date themselves from git history ("Last updated").
          # Never `git fetch --depth` below: it makes a full clone shallow.
          fetch-depth: ${{ github.event_name == 'merge_group' && 1 || 0 }}
          # Commits and trees are all the dates need; files missing from the
          # checkout (old versions) download when read
          filter: ${{ github.event_name != 'merge_group' && 'blob:none' || '' }}
      # While master is the next major (website/versionCurrent.json), its
      # production build serves at /next/ and the `current` job builds the root.
      # The queue builds it that way too, so it fails before the master push does.
      - name: Check for a next version
        id: next
        if: github.event_name != 'pull_request'
        run: |
          [ ! -f website/versionCurrent.json ] || echo "next=1" >> "$GITHUB_OUTPUT"
      # `checks` saves both caches, off this job's critical path
      - name: Install packages
        id: install
        uses: ./.github/actions/website-install
      # The build needs only their JavaScript (`checks` builds the types).
      # Pull requests reuse a build of the same sources, like the install.
      - name: Restore the packages the website imports
        id: libs
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: packages/*/lib
          key: ${{ steps.install.outputs.libs-key }}
      - name: Build the packages the website imports
        if: steps.libs.outputs.cache-hit != 'true'
        run: yarn ci:build:website-lib
      # Each locale is a full build, so PRs build only English and the
      # locales they could change or break (scripts/pick-locales.mjs). The
      # queue and master always build every locale.
      # Versus the merge's first parent, the master it merged into: the event's
      # base sha can be older, and its diff would include master's own changes
      - name: Pick locales
        id: locales
        if: github.event_name == 'pull_request'
        run: |
          # Fails open: every locale when the picker fails
          if locales="$(node website/scripts/pick-locales.mjs HEAD^1)" && [ -n "$locales" ]; then
            # PRs that don't deploy get no preview comment, so say it here too
            echo "::notice title=Locales::This PR builds ${locales// /, }; the merge queue builds every locale"
            echo "locales=$locales" >> "$GITHUB_OUTPUT"
          fi
      # Docusaurus Faster's Rspack cache. Only master saves it, so
      # PRs share one fresh entry instead of each storing their own. Only
      # restore one built from the same yarn.lock: Rspack doesn't invalidate
      # modules whose dependencies changed, so a cache from older
      # dependencies breaks the build.
      - uses: actions/cache/restore@v6
        with:
          path: website/node_modules/.cache
          key: website-rspack-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            website-rspack-${{ hashFiles('yarn.lock') }}-
      - name: Build website
        env:
          # PRs build drafts. The queue and master build production, so a link
          # to a draft fails here instead of on the master push.
          VERCEL_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          LOCALES: ${{ steps.locales.outputs.locales }}
          DOCS_NEXT: ${{ steps.next.outputs.next }}
        # explicit `shell: bash` adds pipefail, so a failed build isn't masked by tee
        shell: bash
        run: |
          args=()
          for locale in $LOCALES; do args+=(--locale "$locale"); done
          yarn workspace rdc-website build "${args[@]}" 2>&1 | tee build.log
          # Warnings (broken links, bundler warnings) fail the check, but not
          # the build itself, which only stops on errors
          if grep -E '\[(WARNING|ERROR)\]' build.log; then
            echo "::error::Website build logged warnings (listed above)"
            exit 1
          fi
      - name: Check the Store inspector stays in its lazy chunk
        run: node website/scripts/check-lazy-chunks.mjs
      # Installed /next/ and locale apps serve only their own build offline
      - name: Check pages load static files from their own build
        env:
          DOCS_NEXT: ${{ steps.next.outputs.next }}
        run: node website/scripts/check-build-base.mjs
      # The version menu's list stays at the root, where every version reads it
      - name: Move the build under /next
        if: steps.next.outputs.next
        run: |
          mv website/build website/next && mkdir website/build && mv website/next website/build/next
          mv website/build/next/site-versions.json website/build/
      # With no /next build, apps installed from it get a worker that
      # unregisters (scripts/snapshot/README.md#current-and-next)
      - name: Retire the /next service workers
        if: ${{ !steps.next.outputs.next }}
        working-directory: website/build
        run: |
          shopt -s nullglob
          for sw in sw.js */sw.js; do
            install -D ../scripts/snapshot/retiredSw.js "next/$sw"
          done
      - if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: website/node_modules/.cache
          # Unique per run: an existing key can't be overwritten
          key: website-rspack-${{ hashFiles('yarn.lock') }}-${{ github.run_id }}
      - name: Decide docs deploy
        id: decide
        if: github.event_name != 'merge_group'
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE: ${{ github.event.before }}
          # Only whether they're set: the secrets stay out of this job
          VERCEL_CONFIGURED: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          skip() {
            echo "::notice title=Docs deploy skipped::$1"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT" = pull_request ]; then
            echo "target=preview" >> "$GITHUB_OUTPUT"
            [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] || skip "Pull requests from forks build the site but don't deploy it"
            [[ "$HEAD_REF" != renovate/* ]] || skip "Renovate branches build the site but don't deploy it"
            export VERCEL_GIT_COMMIT_REF="$HEAD_REF" VERCEL_ENV=preview
          else
            echo "target=production" >> "$GITHUB_OUTPUT"
            [ "$GITHUB_REF" = refs/heads/master ] || skip "Only master deploys to production"
            # Empty on workflow_dispatch, so it always deploys
            export VERCEL_GIT_COMMIT_REF=master VERCEL_ENV=production VERCEL_GIT_PREVIOUS_SHA="$BEFORE"
          fi
          [ "$VERCEL_CONFIGURED" = true ] ||
            skip "Set the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets to deploy"
          if ! bash website/scripts/vercel-ignore.sh; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      # Frozen builds of older versions, served at <version>.dataclient.io
      - name: Add archived versions
        if: steps.decide.outputs.deploy == 'true'
        run: website/scripts/snapshot/fetch.sh website/build
      - name: Upload site for deploy
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: website/build
          # static/.circleci ships with the site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          # A re-run of this job replaces the artifact
          overwrite: true
          # Fastest zip: most of the bytes are videos and images, already compressed
          compression-level: 1

  # Off the preview's critical path: a failure here fails `website`, not the deploy
  checks:
    name: website checks
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # translate.mjs check reads the English its translations were made from
          fetch-depth: ${{ github.event_name == 'merge_group' && 1 || 0 }}
          filter: ${{ github.event_name != 'merge_group' && 'blob:none' || '' }}
      - name: Test Vercel ignore decision
        run: bash website/scripts/vercel-ignore.test.sh
      - name: Install packages
        id: install
        uses: ./.github/actions/website-install
        with:
          save: 'true'
      - name: Check published blog posts are dated today
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --depth=1 origin "$BASE_SHA"
          node website/scripts/blog-publish.mjs --check "$BASE_SHA"
      # Pull requests reuse a build of the same sources, types included, like
      # the install
      - name: Restore package types and the packages the website imports
        id: libs
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: packages/*/lib
          key: ${{ steps.install.outputs.libs-key }}
      - name: Build package types and the packages the website imports
        if: steps.libs.outputs.cache-hit != 'true'
        run: yarn ci:build:website
      # Also for `build` on later runs; a save to an existing key does nothing
      - if: github.event_name != 'merge_group' && steps.libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: packages/*/lib
          key: ${{ steps.install.outputs.libs-key }}
      - name: Typecheck website
        run: yarn workspace rdc-website typecheck
      # CircleCI's lint job covers packages/ only; api/ is the Vercel functions
      - name: Lint website
        run: yarn lint --quiet 'website/{src,api}/**/*.{js,ts,tsx}'
      - name: Check translations
        run: node website/translate/translate.mjs check
      # Translation tooling, sitemap robots.txt, Playground fixture source
      # plugins and the locale picker
      - name: Test website scripts
        run: node --test 'website/translate/*.test.mjs' website/*.test.mjs website/scripts/*.test.mjs

  # The required check (branch protection matches this name): passes when the
  # build and checks passed, or the gate skipped them
  website:
    name: website
    needs: [build, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          BUILD: ${{ needs.build.result }}
          CHECKS: ${{ needs.checks.result }}
        run: |
          for result in "$BUILD" "$CHECKS"; do
            [[ "$result" =~ ^(success|skipped)$ ]] ||
              { echo "::error::website build: $BUILD, website checks: $CHECKS"; exit 1; }
          done

  # While master is the next major, the root serves the current version's
  # docs, built from its branch the way an archive is (scripts/snapshot/README.md)
  current:
    name: current version's site
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ref: ${{ steps.current.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            website/versionCurrent.json
            website/scripts/snapshot
          sparse-checkout-cone-mode: false
      - name: Read the current version
        id: current
        run: |
          f=website/versionCurrent.json
          [ -f "$f" ] || { echo "master is the latest version: nothing to build"; exit 0; }
          ref="$(jq -r .ref "$f")"
          sha="$(git ls-remote origin "refs/heads/$ref" | cut -f1)"
          [ -n "$sha" ] || { echo "::error::No $ref branch to build the root from"; exit 1; }
          { echo "version=$(jq -r .version "$f")"; echo "ref=$ref"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
      # Only the branch and the snapshot scripts change its build, so master
      # pushes reuse it
      - if: steps.current.outputs.sha
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: current.tar.gz
          key: current-site-${{ steps.current.outputs.sha }}-${{ hashFiles('website/scripts/snapshot/**') }}
      - if: steps.current.outputs.sha && !steps.cache.outputs.cache-hit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.current.outputs.sha }}
          path: current
          persist-credentials: false
          # Pages date themselves from git history ("Last updated")
          fetch-depth: 0
          filter: blob:none
      # No dependency cache, like an archive build: the branch has its own lockfile
      - if: steps.current.outputs.sha && !steps.cache.outputs.cache-hit
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Build
        if: steps.current.outputs.sha && !steps.cache.outputs.cache-hit
        env:
          SNAPSHOT_ROLE: current
          VERSION: ${{ steps.current.outputs.version }}
          VERCEL_ENV: production
        run: |
          corepack enable
          website/scripts/snapshot/build.sh current "$VERSION" current.tar.gz
      - if: steps.current.outputs.sha && !steps.cache.outputs.cache-hit
        uses: actions/cache/save@v6
        with:
          path: current.tar.gz
          key: current-site-${{ steps.current.outputs.sha }}-${{ hashFiles('website/scripts/snapshot/**') }}
      - if: steps.current.outputs.sha
        uses: actions/upload-artifact@v7
        with:
          name: current-site
          path: current.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Not required checks: a Vercel outage mustn't block merging. current is
  # skipped on pull requests; it must not fail, or the root would be missing.
  # A preview deploys even when a check failed, without waiting for them
  preview:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.build.result == 'success' && needs.build.outputs.deploy == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/docs-deploy.yml
    secrets: inherit
    with:
      target: preview
      locales: ${{ needs.build.outputs.locales }}

  production:
    needs: [build, checks, current]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build.result == 'success' && needs.build.outputs.deploy == 'true' && needs.checks.result == 'success' && needs.current.result != 'failure' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/docs-deploy.yml
    secrets: inherit
    with:
      target: production
      next: ${{ needs.build.outputs.next }}
      current-ref: ${{ needs.current.outputs.ref }}
