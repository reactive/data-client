name: regenerate
# Reruns the generators whose output is committed: playground editor types
# (yarn copy:websitetypes) and skill references (yarn build:skills).
# Fails when the committed output is stale: PR authors regenerate and commit it.
# Also type-checks the docs' React and Vue examples, and runs the agents'
# browser debugging snippets in Chromium.
# Claude Code rules are left to agent-rules.yml, which installs no dependencies.
on:
  push:
    branches:
      - master
    # Inputs of scripts/copywebsitetypes.sh, website/framework-docs/skillReferences.mjs,
    # scripts/pack-skills.mjs --check, checkExamples.mjs and checkBrowserSnippets.mjs
    paths:
      - 'packages/**'
      - '!packages/**/__tests__/**'
      - '!packages/*/typescript-tests/**'
      - '!packages/*/src-*-types/**'
      - '!packages/**/*.md'
      - 'scripts/copywebsitetypes.sh'
      - 'scripts/strip-dts-comments.mjs'
      - 'scripts/globals.ts'
      - 'scripts/rollup-plugins/**'
      - 'scripts/pack-skills.mjs'
      - '.agents/skill-packages.json'
      - 'website/src/components/Playground/editor-types/**'
      - 'website/src/components/Playground/DesignSystem/index.ts'
      - 'website/src/components/Playground/monaco/typeCheckFlags.json'
      - 'tsconfig*.json'
      - 'docs/**'
      - '.agents/skills/**'
      - 'website/framework-docs/**'
      - 'website/scripts/workspaceSources.mjs'
      - '.gitattributes'
      - 'website/package.json'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/regenerate.yml'
      - '.github/workflows/paths-gate.yml'
  pull_request:
    branches:
      - master
  # Required check: no `paths` (see paths-gate.yml)
  merge_group:

# PRs cancel superseded runs. Push runs get their own group, so master never
# shows a cancelled (red) run.
concurrency:
  group: regenerate-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name != 'push'
    uses: ./.github/workflows/paths-gate.yml

  regenerate:
    name: regenerate
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'yarn'
      - name: Install packages
        # website provides bignumber.js, @number-flow/react, etc.
        run: ./scripts/ci-install.sh website
      - name: Regenerate playground editor types
        run: yarn copy:websitetypes
      - name: Regenerate skill references
        run: yarn build:skills
      - name: Diff generated files
        run: |
          STALE="$(git status --porcelain --untracked-files=all -- \
            website/src/components/Playground/editor-types '.agents/skills/*/references/*')"
          if [ -n "$STALE" ]; then
            echo "$STALE"
            echo "::error::Generated files are stale: merge master, run 'yarn copy:websitetypes' and 'yarn build:skills', and commit the result."
            exit 1
          fi
      - name: Type-check React and Vue examples in the docs
        if: ${{ !cancelled() }}
        run: yarn check:doc-examples

      - name: Get Playwright version
        id: playwright-version
        if: ${{ !cancelled() }}
        run: |
          echo "version=$(node -p "require(require.resolve('playwright/package.json', { paths: ['website'] })).version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        if: ${{ !cancelled() }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium
        if: ${{ !cancelled() }}
        # System deps can't live in the cache, so install them either way.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            yarn workspace rdc-website exec playwright install-deps chromium
          else
            yarn workspace rdc-website exec playwright install chromium --with-deps
          fi
      - name: Run the agents' browser debugging snippets
        if: ${{ !cancelled() }}
        run: yarn check:browser-snippets
