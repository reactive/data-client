name: Vercel Release Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches:
      - master
      - rest-hooks-site
    # Published site only. Keep in sync with website/scripts/vercel-ignore.sh.
    paths:
      - 'website/**'
      - 'docs/core/**'
      - 'docs/rest/**'
      - 'docs/graphql/**'
      - '.github/workflows/site-release.yml'

# One deploy at a time, in push order. `queue: max` keeps every pending run
# instead of cancelling it (a cancelled run marks master red).
concurrency:
  group: site-release-${{ github.ref }}
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 800
      # Queued runs aren't cancelled, so an older one skips when a newer push
      # changed the site: that push's run, queued behind it, deploys.
      # Paths match `on.paths`.
      - name: Check for a newer site change
        id: latest
        run: |
          # Deploys unless it can tell a newer site change landed (fail open)
          rc=0
          git fetch -q origin "$GITHUB_REF" &&
            git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- website docs/core docs/rest docs/graphql || rc=$?
          if [ "$rc" = 1 ]; then
            echo "::notice::Skipping: $(git rev-parse --short FETCH_HEAD) changed the site again and deploys it"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Vercel CLI
        if: steps.latest.outputs.deploy
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        if: steps.latest.outputs.deploy
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        if: steps.latest.outputs.deploy
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        if: steps.latest.outputs.deploy
        continue-on-error: true
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}