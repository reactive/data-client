name: Vercel Release Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches:
      - master
      - rest-hooks-site
    # Published site only. Keep in sync with website/scripts/vercel-ignore.sh.
    paths:
      - 'website/**'
      - 'docs/core/**'
      - 'docs/rest/**'
      - 'docs/graphql/**'
      - '.github/workflows/site-release.yml'

# One deploy at a time, in push order. `queue: max` keeps every pending run
# instead of cancelling it (a cancelled run marks master red).
concurrency:
  group: site-release-${{ github.ref }}
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 800
      # Runs queue in push order, so a run can start after newer commits
      # landed. Deploy the branch tip so production never goes backwards, even
      # if the newer push has no run of its own ([skip ci]).
      - name: Use the branch tip
        run: git fetch -q origin "$GITHUB_REF" && git checkout -q FETCH_HEAD || echo "::warning::Could not fetch $GITHUB_REF; deploying $GITHUB_SHA"
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        continue-on-error: true
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}