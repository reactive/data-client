name: editor-types
on:
  # master catches drift from PRs merged in sequence
  push:
    branches:
      - master
    # Inputs of scripts/copywebsitetypes.sh
    paths:
      - 'packages/**'
      - '!packages/**/__tests__/**'
      - '!packages/*/typescript-tests/**'
      - '!packages/*/src-*-types/**'
      - '!packages/**/*.md'
      - 'scripts/copywebsitetypes.sh'
      - 'scripts/strip-dts-comments.mjs'
      - 'scripts/globals.ts'
      - 'scripts/rollup-plugins/**'
      - 'website/src/components/Playground/editor-types/**'
      - 'website/package.json'
      - 'package.json'
      - 'yarn.lock'
      - 'tsconfig*.json'
      - '.github/workflows/editor-types.yml'
  pull_request:
    branches:
      - master
  # Required check: no `paths` here (merge_group ignores them); the gate
  # skips the job unless a file in push `paths` changed
  merge_group:

# PRs cancel superseded runs. Push runs get their own group, so master never
# shows a cancelled (red) run.
concurrency:
  group: editor-types-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/paths-gate.yml

  check:
    # The required check's name
    name: editor-types
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'yarn'
      - name: Install packages
        # website provides bignumber.js, @number-flow/react, etc.
        run: ./scripts/ci-install.sh website
      - name: Check playground editor types are up to date
        run: |
          yarn copy:websitetypes
          STALE="$(git status --porcelain -- website/src/components/Playground/editor-types)"
          if [ -n "${STALE}" ]; then
            echo "${STALE}"
            echo "::error::Playground editor types are stale: run 'yarn copy:websitetypes' and commit the result."
            exit 1
          fi
