name: docs deploy
# Reusable: site-preview.yml's deploy, called once for previews and once for
# production, which also waits for the website checks
on:
  workflow_call:
    inputs:
      target:
        description: preview or production
        type: string
        required: true
      next:
        description: Non-empty when the build serves at /next/
        type: string
      current-ref:
        description: The branch the root was built from, when it was
        type: string
      locales:
        description: The locales a preview built, when not all of them
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: docs deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ inputs.target == 'production' && 'docs-production' || 'docs-preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      # renovate: datasource=npm depName=vercel
      VERCEL_CLI_VERSION: 63.1.2
      TARGET: ${{ inputs.target }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      # Both jobs read versionCurrent.json, in parallel: a root without /next,
      # or /next without a root, would ship a broken site
      - name: Check the root and /next agree
        env:
          NEXT: ${{ inputs.next }}
          REF: ${{ inputs.current-ref }}
        run: |
          [ "${NEXT:+1}" = "${REF:+1}" ] ||
            { echo "::error::/next built: ${NEXT:-no}, but the root built from: ${REF:-nothing}"; exit 1; }
      # vercel build reads the first three (api/ holds the site's functions,
      # which it bundles); production also runs vercel-ignore.sh --superseded.
      # No other repo scripts run: vercel build only runs vercel.json's guard
      # command, and installs api/'s dependencies without their scripts. The
      # token is still as exposed as same-repo push access, since vercel.json
      # can change the command.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            website/package.json
            website/vercel.json
            website/versionsArchived.json
            website/api/
            website/scripts/vercel-ignore.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: site-build
          path: website/build
      - if: inputs.current-ref
        uses: actions/download-artifact@v8
        with:
          name: current-site
      - name: Add the current version's site at the root
        if: inputs.current-ref
        run: |
          tar -xzf current.tar.gz -C website/build
          # /next is served now, so it no longer redirects to the root
          nextRedirect='.source | startswith("/next{/:path")'
          jq -e ".redirects | map(select($nextRedirect)) | length == 1" website/vercel.json > /dev/null ||
            { echo "::error::vercel.json has no single /next redirect to drop"; exit 1; }
          jq ".redirects |= map(select($nextRedirect | not))" website/vercel.json > vercel.json.tmp
          mv vercel.json.tmp website/vercel.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Restore the Vercel CLI
        id: vercel-cli
        uses: actions/cache@v6
        with:
          path: ~/vercel-cli
          key: vercel-cli-${{ env.VERCEL_CLI_VERSION }}-node26-${{ runner.os }}-${{ runner.arch }}
      - if: steps.vercel-cli.outputs.cache-hit != 'true'
        run: npm install --global --prefix ~/vercel-cli "vercel@$VERCEL_CLI_VERSION"
      - run: echo "$HOME/vercel-cli/bin" >> "$GITHUB_PATH"
      - name: Deploy
        id: deploy
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # vercel build runs npm install for api/'s functions
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          # Checked here, not in `website`, so a re-run of this job can't roll
          # production back to an older master commit
          if [ "$TARGET" = production ]; then
            rc=0
            bash website/scripts/vercel-ignore.sh --superseded || rc=$?
            case "$rc" in
              0)
                echo "::notice title=Docs deploy skipped::master moved on to a newer site, whose run deploys it"
                exit 0 ;;
              1) ;;
              # couldn't fetch master: fail rather than risk a rollback
              *) exit "$rc" ;;
            esac
          fi
          vercel pull --yes --environment="$TARGET"
          # Packages the downloaded build into .vercel/output
          vercel build --yes --target="$TARGET"
          # vercel.json's rewrites run after the file check, where the root's
          # pages would answer an archive's host; serve its own files first
          config=.vercel/output/config.json
          jq 'def archive: .dest? // "" | startswith("/archives/");
            .routes |= (
              map(select(archive)) as $archive
              | map(select(archive | not)) as $rest
              | ($rest | map(.handle == "filesystem") | index(true)) as $fs
              | if ($archive | length) != 1 then error("no single archive host rewrite to move")
                elif $fs == null then error("no filesystem check to move it ahead of")
                else $rest[:$fs] + $archive + $rest[$fs:] end)' "$config" > config.json.tmp ||
            { echo "::error::Couldn't move $config's archive host rewrite"; exit 1; }
          mv config.json.tmp "$config"
          # A miss gets the root's 404.html, which is another site under /next/
          # or a locale and has no styles on an archive's host; answer it with
          # the 404.html of the build it's in. Archives first, as their hosts'
          # paths look like the root's; then the longest prefix wins. An archive's
          # route replaces src and adds its host
          jq '
            ($ARGS.positional | sort_by((startswith("archives/") | not), -length) | map(
              { src: "^/\(.)/", dest: "/\(.)/404", status: 404 } + ((
                split("/") | select(.[0] == "archives")
                | (.[1] | gsub("\\."; "\\.")) as $v
                | { src: "^(?:/archives/\($v))?/\(.[2:] | map(. + "/") | join("") | if . == "" then "(?!api(?:/|$))" end)",
                    has: [{ type: "host", value: "\($v)\\.dataclient\\.io" }] }
              ) // {}))) as $notFound
            | (.routes | map(.handle == "error") | index(true)) as $errorPhase
            | if $errorPhase == null then error("no error phase to add them to")
              else .routes |= .[:$errorPhase + 1] + $notFound + .[$errorPhase + 1:] end' "$config" --args \
            $(find website/build -mindepth 2 -name 404.html -printf '%h\n' | cut -d/ -f3-) > config.json.tmp ||
            { echo "::error::Couldn't add each build's 404 page to $config"; exit 1; }
          mv config.json.tmp "$config"
          meta=()
          # Ties the preview to its branch instead of the PR merge ref
          [ -n "$HEAD_REF" ] && meta=(--meta githubDeployment=1 --meta "githubCommitRef=$HEAD_REF")
          url="$(vercel deploy --prebuilt --archive=tgz --target="$TARGET" "${meta[@]}")"
          echo "deployment=$url" >> "$GITHUB_OUTPUT"
          # A preview's own URL changes on every push, so point the PR's
          # alias at it: one link that always shows the PR's newest build
          if [ -n "$PR_NUMBER" ]; then
            alias="docs-site-pr-$PR_NUMBER-data-client.vercel.app"
            # Unlike deploy, alias ignores VERCEL_ORG_ID and would look in the
            # token's personal account
            if vercel alias set "$url" "$alias" --scope "$VERCEL_ORG_ID"; then
              url="https://$alias"
            else
              echo "::warning title=Docs preview alias::Couldn't point $alias at this deploy; linking the deploy itself"
            fi
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          { echo "### Docs $TARGET deployment"; echo; echo "$url"; } >> "$GITHUB_STEP_SUMMARY"
      # Each archived version serves at its own host (vercel.json), which the
      # project needs as a domain. dataclient.io's DNS (Cloudflare) already sends
      # every subdomain to Vercel; a failure only leaves that version's host unserved
      - name: Add archived versions' domains
        if: env.TARGET == 'production' && steps.deploy.outputs.url
        run: |
          for version in $(jq -r '.[].version' website/versionsArchived.json); do
            domain="$version.dataclient.io"
            # Exits 0 when the project already has it (vercel 63.1); --scope as for alias
            vercel domains add "$domain" "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --non-interactive ||
              echo "::warning title=Archive domain::Couldn't add $domain to the Vercel project; add it by hand"
          done
      - if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: docs-preview
          message: |
            **Docs preview:** ${{ steps.deploy.outputs.url }}

            Built from ${{ github.event.pull_request.head.sha }} merged into `master` ([this build](${{ steps.deploy.outputs.deployment }})).${{ inputs.locales && format(' Locales: {0} (the merge queue builds every locale).', inputs.locales) || '' }}
